<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>MBD Budget has moved</title>
  <style>
    body { font-family: -apple-system, 'Inter', sans-serif; background: #0f0f0f; color: #fff; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1.5rem; }
    a { color: #8bffec; }
    p { color: rgba(255,255,255,.7); line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>MBD Budget has moved</h1>
    <p id="status">Clearing what this address had saved on this device…</p>
    <p><a href="https://mbd-budget.github.io/">Go to the new address</a></p>
  </main>
  <script>
    // This address shares its browser storage with other sites, so remove everything the
    // budget app ever saved here (the sign-in and the cached figures), then move on.
    (function () {
      var cleared = true;
      try {
        var exact = ['mbd_state_v1', 'mbd_user_email', 'budget_theme', '_budgetv', 'budget_state_v1', 'budget_admin', 'budget_period'];
        exact.forEach(function (k) { localStorage.removeItem(k); });
        Object.keys(localStorage).forEach(function (k) {
          if (k.indexOf('sb-wbtwpxiijfveenlsocmx-auth-token') === 0) localStorage.removeItem(k);
        });
      } catch (e) { cleared = false; }
      document.getElementById('status').textContent = cleared
        ? 'Cleared. Taking you to the new address…'
        : 'Could not clear saved data on this device. Clear this site\'s data in your browser settings.';
      if (cleared) setTimeout(function () { location.replace('https://mbd-budget.github.io/'); }, 1200);
    })();
  </script>
</body>
</html>
